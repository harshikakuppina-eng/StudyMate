<head>

        }

            margin: 0;
            background: #F3F4F6;
            color: #1F2937;
            font-family: Arial, sans-serif;
        }

        /* ================= NAVBAR ================= */

        .quiz-navbar {
            background: #14B8A6;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .quiz-logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .quiz-nav-links {
            display: flex;
            gap: 25px;
        }

        .quiz-nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .quiz-nav-links a:hover {
            color: #CCFBF1;
        }

        /* ================= MAIN ================= */

        .quiz-container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        /* ================= HERO ================= */

        .quiz-hero {
            text-align: center;
            background: linear-gradient(
                135deg,
                #CCFBF1,
                #F0FDFA
            );
            padding: 45px 20px;
            border-radius: 0 0 30px 30px;
            margin-bottom: 30px;
        }

        .quiz-hero h1 {
            font-size: 42px;
            color: #115E59;
            margin: 0 0 12px;
        }

        .quiz-hero p {
            color: #475569;
            font-size: 17px;
            margin: 0;
        }

        /* ================= PANELS ================= */

        .panel {
            background: white;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .panel h2 {
            color: #115E59;
            margin-top: 0;
        }

        /* ================= SUBJECTS ================= */

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-top: 25px;
        }

        .subject-btn {
            width: 100%;
            min-height: 115px;
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 20px 12px;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
            background: white;
            color: #1F2937;
            box-shadow: 0 8px 22px rgba(0,0,0,0.08);
            transition: all 0.2s ease;
        }

        .subject-btn:hover {
            transform: translateY(-5px);
            border-color: #14B8A6;
            background: #F0FDFA;
            box-shadow: 0 14px 28px rgba(20,184,166,0.18);
        }

        .subject-btn:active {
            transform: scale(0.98);
        }

        /* ================= TOPICS ================= */

        .topic-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .topic-btn {
            width: 100%;
            border: 2px solid #E5E7EB;
            border-radius: 14px;
            padding: 18px;
            cursor: pointer;
            background: white;
            color: #1F2937;
            font-size: 15px;
            font-weight: bold;
            text-align: left;
            transition: all 0.2s ease;
        }

        .topic-btn:hover {
            border-color: #14B8A6;
            background: #F0FDFA;
            transform: translateY(-3px);
        }

        /* ================= HIDDEN ================= */

        .hidden {
            display: none !important;
        }

        /* ================= BACK BUTTON ================= */

        .back-btn {
            border: none;
            padding: 11px 18px;
            border-radius: 10px;
            background: #0F766E;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: #115E59;
        }

        /* ================= QUESTIONS ================= */

        .question-card {
            background: white;
            margin: 22px 0;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .question-card h3 {
            color: #115E59;
            margin-top: 0;
            line-height: 1.5;
        }

        .option {
            display: block;
            padding: 14px;
            margin: 10px 0;
            border-radius: 10px;
            background: #F0FDFA;
            border: 1px solid #CCFBF1;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            background: #CCFBF1;
        }

        .option input {
            margin-right: 10px;
            cursor: pointer;
        }

        /* ================= SUBMIT ================= */

        .submit-quiz {
            display: block;
            margin: 30px auto;
            padding: 15px 35px;
            border: none;
            border-radius: 12px;
            background: #14B8A6;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-quiz:hover {
            background: #0F766E;
        }

        /* ================= RESULT ================= */

        .result-box {
            text-align: center;
            padding: 25px;
            margin-top: 25px;
            border-radius: 16px;
            background: #ECFDF5;
            color: #115E59;
            font-size: 20px;
            font-weight: bold;
            border: 1px solid #A7F3D0;
        }

        .small-note {
            text-align: center;
            color: #64748B;
        }

        /* ================= FOOTER ================= */

        .quiz-footer {
            background: #134E4A;
            color: #CCFBF1;
            text-align: center;
            padding: 30px;
            margin-top: 40px;
        }

        /* ================= MOBILE ================= */

            .subject-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .topic-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .quiz-navbar {
                flex-direction: column;
                gap: 15px;
            }

        }

        @media (max-width: 550px) {

            .subject-grid,
            .topic-grid {
                grid-template-columns: 1fr;
            }

            .quiz-hero h1 {
                font-size: 32px;
            }

            .quiz-navbar {
                padding: 15px;
            }

            .quiz-nav-links {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

</head>

/* =========================================================
   SELECT SUBJECT
   ========================================================= */

function selectSubject(subject) {

    selectedSubject = subject;

    selectedTopic = "";

    document
        .getElementById("subjectPanel")
        .classList.add("hidden");

    document
        .getElementById("quizPanel")
        .classList.add("hidden");

    document
        .getElementById("topicPanel")
        .classList.remove("hidden");


    document
        .getElementById("topicTitle")
        .textContent =
        "2️⃣ " + subject + " — Choose a Topic";


    const grid =
        document.getElementById("topicGrid");


    grid.innerHTML = "";


    const topics =
        Object.keys(questionBank[subject]);


    topics.forEach(function(topic, index) {

        const button =
            document.createElement("button");


        button.type = "button";

        button.className = "topic-btn";

        button.textContent =
            (index + 1) + ". " + topic;


        button.onclick = function() {

            startQuiz(topic);

        };


        grid.appendChild(button);

    });

}


/* =========================================================
   START QUIZ
   ========================================================= */

function startQuiz(topic) {

    selectedTopic = topic;


    currentQuestions =
        questionBank[selectedSubject][selectedTopic];


    document
        .getElementById("topicPanel")
        .classList.add("hidden");


    document
        .getElementById("quizPanel")
        .classList.remove("hidden");


    document
        .getElementById("quizTitle")
        .textContent =
        "📝 " +
        selectedSubject +
        " → " +
        selectedTopic;


    const form =
        document.getElementById("quizForm");


    form.innerHTML = "";


    currentQuestions.forEach(function(question, index) {

        const card =
            document.createElement("div");

        card.className =
            "question-card";


        const heading =
            document.createElement("h3");


        heading.textContent =
            (index + 1) +
            ". " +
            question.q;


        card.appendChild(heading);


        question.options.forEach(
            function(option, optionIndex) {


                const label =
                    document.createElement("label");


                label.className =
                    "option";


                const radio =
                    document.createElement("input");


                radio.type = "radio";


                radio.name =
                    "question" + index;


                radio.value =
                    optionIndex;


                label.appendChild(radio);


                label.appendChild(
                    document.createTextNode(
                        " " + option
                    )
                );


                card.appendChild(label);

            }
        );


        form.appendChild(card);

    });


    document
        .getElementById("result")
        .textContent =
        "Answer all " +
        currentQuestions.length +
        " questions and submit the quiz.";

}


/* =========================================================
   CHECK QUIZ
   ========================================================= */

function checkQuiz() {

    if (currentQuestions.length === 0) {

        alert("Please choose a topic first.");

        return;

    }


    let score = 0;

    let answered = 0;


    currentQuestions.forEach(
        function(question, index) {


            const selected =
                document.querySelector(
                    'input[name="question' +
                    index +
                    '"]:checked'
                );


            if (selected) {

                answered++;


                if (
                    Number(selected.value) ===
                    question.answer
                ) {

                    score++;

                }

            }

        }
    );


    if (
        answered <
        currentQuestions.length
    ) {

        document
            .getElementById("result")
            .textContent =
            "⚠️ Please answer all " +
            currentQuestions.length +
            " questions.";

        return;

    }


    /* SAVE QUIZ RESULT */

    localStorage.setItem(
        "studymateQuizScore",
        score
    );


    localStorage.setItem(
        "studymateQuizTotal",
        currentQuestions.length
    );


    localStorage.setItem(
        "studymateQuizSubject",
        selectedSubject
    );


    localStorage.setItem(
        "studymateQuizTopic",
        selectedTopic
    );


    const percentage =
        Math.round(
            (score /
            currentQuestions.length) *
            100
        );


    document
        .getElementById("result")
        .innerHTML =

        "🎉 Your Score: " +
        score +
        "/" +
        currentQuestions.length +

        " (" +
        percentage +
        "%)" +

        "<br><small>" +

        selectedSubject +
        " → " +
        selectedTopic +

        "</small>";

}

   BACK TO SUBJECTS

    document

    document
        .getElementById("quizPanel")
        .classList.add("hidden");


    document
        .getElementById("subjectPanel")
        .classList.remove("hidden");


    selectedSubject = "";

    selectedTopic = "";

    currentQuestions = [];

}

    document

}
