<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Planner | StudyMate</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-logo">📚 StudyMate</div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/learn">Learn</a>
            <a href="/planner" class="active">Planner</a>
        </div>
    </nav>


    <!-- PLANNER -->
    <main class="planner-page">

        <section class="planner-hero">

            <div>
                <span class="planner-label">📅 STUDY PLANNER</span>

                <h1>Plan Your Study Time</h1>

                <p>
                    Organize your subjects, tasks and study goals
                    in one simple place.
                </p>
            </div>

        </section>


        <!-- ADD TASK -->
        <section class="planner-card">

            <h2>➕ Add Study Task</h2>

            <form id="taskForm">

                <div class="planner-form-grid">

                    <div class="planner-input-group">
                        <label for="task">Study Task</label>

                        <input
                            type="text"
                            id="task"
                            placeholder="Example: Study Python Functions"
                            required
                        >
                    </div>


                    <div class="planner-input-group">
                        <label for="subject">Subject</label>

                        <select id="subject" required>
                            <option value="">Select Subject</option>
                            <option value="Python">Python</option>
                            <option value="Web Development">Web Development</option>
                            <option value="Cybersecurity">Cybersecurity</option>
                            <option value="Computer Networks">Computer Networks</option>
                        </select>
                    </div>


                    <div class="planner-input-group">
                        <label for="date">Date</label>

                        <input
                            type="date"
                            id="date"
                            required
                        >
                    </div>


                    <div class="planner-input-group">
                        <label for="time">Study Time</label>

                        <input
                            type="time"
                            id="time"
                            required
                        >
                    </div>

                </div>

                <button type="submit" class="planner-add-button">
                    Add Task →
                </button>

            </form>

        </section>


        <!-- TASK LIST -->
        <section class="planner-card">

            <div class="planner-list-header">

                <div>
                    <span class="planner-small-label">YOUR PLAN</span>

                    <h2>📚 Study Tasks</h2>
                </div>

                <span id="taskCount" class="task-count">
                    0 Tasks
                </span>

            </div>


            <div id="taskList" class="task-list">

                <div class="empty-planner">
                    <div class="empty-icon">📝</div>

                    <h3>No study tasks yet</h3>

                    <p>
                        Add your first study task above and start planning.
                    </p>
                </div>

            </div>

        </section>


        <!-- BACK BUTTON -->
        <div class="planner-back">
            <a href="/learn">← Back to Learning</a>
        </div>

    </main>


    <!-- PLANNER JAVASCRIPT -->
    <script>

        const taskForm = document.getElementById("taskForm");
        const taskList = document.getElementById("taskList");
        const taskCount = document.getElementById("taskCount");


        // Load saved tasks
        let tasks = JSON.parse(localStorage.getItem("studymateTasks")) || [];


        // Display tasks
        function displayTasks() {

            taskList.innerHTML = "";

            if (tasks.length === 0) {

                taskList.innerHTML = `
                    <div class="empty-planner">
                        <div class="empty-icon">📝</div>

                        <h3>No study tasks yet</h3>

                        <p>
                            Add your first study task above and start planning.
                        </p>
                    </div>
                `;

                taskCount.textContent = "0 Tasks";

                return;
            }


            taskCount.textContent =
                tasks.length + (tasks.length === 1 ? " Task" : " Tasks");


            tasks.forEach(function(task, index) {

                const taskItem = document.createElement("div");

                taskItem.className =
                    "study-task " + (task.completed ? "completed" : "");


                taskItem.innerHTML = `

                    <div class="task-check">

                        <input
                            type="checkbox"
                            ${task.completed ? "checked" : ""}
                            onchange="completeTask(${index})"
                        >

                    </div>


                    <div class="task-details">

                        <h3>${task.task}</h3>

                        <div class="task-info">

                            <span>📚 ${task.subject}</span>

                            <span>📅 ${task.date}</span>

                            <span>⏰ ${task.time}</span>

                        </div>

                    </div>


                    <button
                        class="delete-task"
                        onclick="deleteTask(${index})"
                    >
                        🗑️
                    </button>

                `;


                taskList.appendChild(taskItem);

            });

        }


        // Add task
        taskForm.addEventListener("submit", function(event) {

            event.preventDefault();


            const task = document.getElementById("task").value.trim();

            const subject =
                document.getElementById("subject").value;

            const date =
                document.getElementById("date").value;

            const time =
                document.getElementById("time").value;


            if (!task || !subject || !date || !time) {

                alert("❌ Please fill all fields.");

                return;
            }


            tasks.push({

                task: task,
                subject: subject,
                date: date,
                time: time,
                completed: false

            });


            localStorage.setItem(
                "studymateTasks",
                JSON.stringify(tasks)
            );


            taskForm.reset();

            displayTasks();


            alert("✅ Study task added!");

        });


        // Complete task
        function completeTask(index) {

            tasks[index].completed =
                !tasks[index].completed;


            localStorage.setItem(
                "studymateTasks",
                JSON.stringify(tasks)
            );


            displayTasks();

        }


        // Delete task
        function deleteTask(index) {

            const confirmDelete =
                confirm("Are you sure you want to delete this task?");


            if (!confirmDelete) {
                return;
            }


            tasks.splice(index, 1);


            localStorage.setItem(
                "studymateTasks",
                JSON.stringify(tasks)
            );


            displayTasks();

        }


        // Initial display
        displayTasks();

    </script>

</body>
</html>
