<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyMate Certificate</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2ff;
            font-family: Georgia, "Times New Roman", serif;
            padding: 30px;
        }

        .certificate {
            width: 100%;
            max-width: 950px;
            background: white;
            padding: 12px;
            border: 8px solid #4f46e5;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .certificate-inner {
            border: 3px solid #7c3aed;
            padding: 55px 40px;
            text-align: center;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #4f46e5;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 48px;
            margin: 20px 0 10px;
            color: #1e293b;
        }

        .subtitle {
            font-size: 20px;
            color: #64748b;
        }

        .student-name {
            font-size: 38px;
            font-weight: bold;
            color: #4f46e5;
            margin: 25px 0;
        }

        .course-text {
            font-size: 20px;
            color: #334155;
        }

        .course-name {
            font-size: 30px;
            font-weight: bold;
            color: #7c3aed;
            margin: 15px 0 25px;
        }

        .completion-text {
            font-size: 17px;
            color: #64748b;
            line-height: 1.6;
        }

        .details {
            margin-top: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #475569;
            font-size: 15px;
        }

        .signature {
            border-top: 1px solid #94a3b8;
            padding-top: 8px;
            min-width: 180px;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 12px 24px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        @media print {

            body {
                background: white;
                padding: 0;
            }

            .certificate {
                box-shadow: none;
                max-width: none;
            }

            .buttons {
                display: none;
            }
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .certificate-inner {
                padding: 35px 20px;
            }

            h1 {
                font-size: 34px;
            }

            .student-name {
                font-size: 28px;
            }

            .course-name {
                font-size: 24px;
            }

            .details {
                flex-direction: column;
                gap: 25px;
            }
        }
    </style>
</head>

<body>

    <div>

        <div class="certificate">

            <div class="certificate-inner">

                <div class="logo">
                    STUDYMATE
                </div>

                <h1>
                    Certificate of Completion
                </h1>

                <div class="subtitle">
                    This certificate is proudly presented to
                </div>

                <div class="student-name" id="studentName">
                    Student
                </div>

                <div class="course-text">
                    for successfully completing the
                </div>

                <div class="course-name" id="courseName">
                    Course
                </div>

                <div class="completion-text">
                    This certificate recognizes the completion of
                    all 15 learning topics in the selected StudyMate
                    course.
                </div>

                <div class="details">

                    <div>
                        <strong>Date</strong>
                        <br>
                        <span id="certificateDate"></span>
                    </div>

                    <div class="signature">
                        StudyMate
                        <br>
                        Student Learning Assistant
                    </div>

                </div>

            </div>

        </div>

        <div class="buttons">

            <button onclick="window.print()">
                🖨️ Download / Save as PDF
            </button>

            <button onclick="window.location.href='/progress'">
                ← Back to Progress
            </button>

        </div>

    </div>

    <script>

        const params =
            new URLSearchParams(window.location.search);

        const course =
            params.get("course") || "StudyMate Course";

        document.getElementById(
            "courseName"
        ).textContent = course;

        const today = new Date();

        document.getElementById(
            "certificateDate"
        ).textContent =
            today.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }
            );

        const name =
            localStorage.getItem("studentName");

        if (name) {
            document.getElementById(
                "studentName"
            ).textContent = name;
        }

    </script>

</body>

</html>
