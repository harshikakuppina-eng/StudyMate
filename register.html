<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | StudyMate</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- Premium Register Page -->

    <div class="auth-page">

        <div class="auth-card premium-auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                📚 <span>StudyMate</span>
            </div>


            <!-- Welcome -->
            <div class="auth-welcome">

                <p class="auth-label">
                    STUDENT LEARNING ASSISTANT
                </p>

                <h1>
                    Create Account ✨
                </h1>

                <p class="auth-subtitle">
                    Start your learning journey today.
                </p>

            </div>


            <!-- Register Form -->
            <form id="registerForm">

                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button">

                    Create Account →

                </button>

            </form>


            <!-- Login Link -->
            <p class="auth-footer">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
